inherit_gem:
  rubocop-infinum: rubocop.yml

require:
  - rubocop-infinum
  - rubocop-rake

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*_spec.rb'

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 5

Style/AccessorGrouping:
  EnforcedStyle: separated

Style/FrozenStringLiteralComment:
  Enabled: false

Rails/StrongParametersExpect:
  Enabled: false

RSpecRails/HttpStatusNameConsistency:
  Enabled: false

RSpec/MatchWithSimpleRegex:
  Enabled: false

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - 'spec/dummy/db/schema.rb'
    - 'spec/dummy/db/migrate/*.rb'
    - 'spec/dummy/bin/setup'
  NewCops: enable
